# الإشارة الوحيدة — القسم 5
#
# هذا هو الملف الوحيد الذي يعمل في مستودع المحتوى.
# لا يقرأ محتوى، ولا يكتب شيئاً، ولا يبني. يرسل إشارة فقط.
#
# السر BUILD_TRIGGER_TOKEN رمز دقيق الصلاحية:
#   مستودع واحد (blog-build) · صلاحية واحدة (Actions: Read and write)
#   لا يقرأ ملفاً، ولا يكتب كوداً، ولا يصل لبقية الحساب.
#   أقصى ما يفعله من يسرقه: تشغيل بناء. راجع ARCHITECTURE.md § 6 في blog-build.
#
# لماذا workflow_dispatch لا repository_dispatch (تصحيح للقسم 6.1):
#   repository_dispatch يتطلب contents:write — أي القدرة على تعديل قوالب
#   البناء وميزانياته، وهو ما وُضع القسم 6.2 تحديداً لمنعه.
#   أُثبت عملياً 2026-08-02: الاستدعاء رجع 403.
name: dispatch

on:
  push:
    branches: [main]
    paths:
      - 'content/**'

# لا صلاحية إطلاقاً للرمز الافتراضي — هذا العمل لا يحتاج شيئاً من هذا المستودع
permissions: {}

# حفظات متتابعة لا تُنتج إشارات متراكمة
concurrency:
  group: dispatch
  cancel-in-progress: true

jobs:
  signal:
    name: إشارة البناء
    runs-on: ubuntu-latest
    steps:
      - name: تشغيل البناء في blog-build
        env:
          TOKEN: ${{ secrets.BUILD_TRIGGER_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::السر BUILD_TRIGGER_TOKEN غير مضبوط في إعدادات هذا المستودع."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/zeroone01z21-alt/blog-build/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main","inputs":{"reason":"دفعة في مستودع المحتوى"}}')
          case "$code" in
            204) echo "أُرسلت الإشارة." ;;
            401) echo "::error::الرمز مرفوض — على الأرجح انتهت صلاحيته. جدِّده وحدِّث السر." ; exit 1 ;;
            403) echo "::error::الرمز لا يملك صلاحية Actions:write على blog-build." ; exit 1 ;;
            *)   echo "::error::تعذّر تشغيل البناء (HTTP $code)." ; exit 1 ;;
          esac
